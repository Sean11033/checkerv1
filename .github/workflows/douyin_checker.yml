name: Douyin Live Checker (API Intercept)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Check Script
        env:
          # 將兩個房間 ID 都作為環境變數注入
          DOUYIN_ROOM_ID: ${{ secrets.DOUYIN_ROOM_ID }}
          DOUYIN_ROOM_ID2: ${{ secrets.DOUYIN_ROOM_ID2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_live.py

      - name: Commit and Push State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live status to state.json"
          file_pattern: "state.json"
