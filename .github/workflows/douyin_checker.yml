name: Douyin Live Checker (API Intercept)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Action 寫回 state.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Check Script
        env:
          DOUYIN_ROOM_ID: ${{ secrets.DOUYIN_ROOM_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_live.py

      - name: Commit and Push State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live status to state.json [skip ci]"
          file_pattern: "state.json"
